software:
  - name: ontoFAST
    short_description: Interactive and semi-automatic annotation of characters with biological ontologies
    logo: webp/Software-ontoFAST-logo-300x340.webp
    github: https://github.com/sergeitarasov/ontoFAST
    image: webp/Software-ontoFAST-Shiny-interface-feature-image-1024x564.webp
    authors: |
        **Sergei Tarasov**, István Mikó, Matthew Jon Yoder
    doc_url: https://github.com/sergeitarasov/ontoFAST/wiki
    publications: |
        @ARTICLE{Tarasov2022-es,
          title     = "{ontoFAST}: An {R} package for interactive and semi‐automatic
                       annotation of characters with biological ontologies",
          author    = "Tarasov, Sergei and Mik{\'o}, Istv{\'a}n and Yoder, Matthew Jon",
          journal   = "Methods Ecol. Evol.",
          publisher = "Wiley",
          volume    =  13,
          number    =  2,
          pages     = "324--329",
          month     =  feb,
          year      =  2022,
          doi       = "10.1111/2041-210X.13753",
          copyright = "http://onlinelibrary.wiley.com/termsAndConditions\#vor",
          language  = "en"
        }
    description: |
        The R package 'ontoFAST' aids in annotating characters and character matrices with biological ontologies. Its interactive interface allows quick and convenient tagging of character statements with necessary ontology terms. The produced annotations can be exported in csv format for downstream analysis. Additionally, OntoFAST provides:
        1. Functions for constructing simple queries of characters against ontologies, and
        2. Helper function for exporting and visualising complex ontological hierarchies and their relationships.

  - name: Rphenoscate
    github: https://github.com/uyedaj/rphenoscate
    short_description: Semantics for comparative analyses of trait evolution
    image: webp/Software-rphenoscate-scheme-of-main-components-in-1024x1031.webp
