  - name: |
        Ontology-informed phylogenetic methods
    short_description: Making traits machine readable for evolutionary analysis
    image: webp/Projects-Oxysternon-conspicillatum-CC-BY-desertnaturalist-inaturalist.org-observations-291846884-1024x914.webp
    image_caption: Rhinoceros Dung Beetle (<em>Oxysternon conspicillatum</em>) CC-BY Desertnaturalist
    image_caption_link: https://www.inaturalist.org/observations/291846884
    image_caption_link_title: Go to observation on iNaturalist
    description: |
        If you take the time to observe any organism, you'll find a wealth of details.These observable details are called "traits" or "characters" and they are used across biology to define and describe species, to recognize, define, and diagnose pathological conditions, and to evaluate how organisms develop, evolve, and interact with their environment.
        
        The challenge with using traits in biology is that we describe them using everyday language (i.e., natural language). However, for computers to use these phenotypic data, they need to be in a format that is "machine readable" with standardized formats for hierarchical relationships, shape descriptions, size measurements, etc. This standardization also makes it possible to compare multiple species, each with their own unique set of traits.The science of standardizing and categorizing these descriptions is ontology.

        Our lab is combining statistical modeling and ontology-based tools to create new phylogenetic methods for reconstructing the evolution of traits. Although we largely use dung beetles as a test case for these methods, they are applicable to any group of organisms. These methods allow us to convert the vast wealth of descriptions available from text into data for reconstructing how and why organisms on Earth have evolved such a great diversity of shapes, sizes, and structures.

