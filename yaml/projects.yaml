  - name: |
        Dung Beetle Evolution
    short_description: Discovering the evolutionary history of a diverse and ecologically vital group
    image: webp/Projects-Scarabaeus-galenus-CC-BY-NC-Andre-Harmse-inaturalist-observations-143277259-796x683.webp
    image_caption: <em>Scarabaeus galenus</em> CC-BY-NC Andre Harmse
    image_caption_link: https://www.inaturalist.org/observations/143277259
    image_caption_link_title: Go to observation on iNaturalist
    description: |
        Dung beetles (Coleoptera: Scarabaeinae) are remarkable both for their diversity and the ecosystem services that they perform. There are over 6,000 species of dung beetles, more than the approximately 5,500 species of living mammals. And their diversity isn't just about numbers: some groups of dung beetles have evolved extravagant and varied head horns, making them a model system in developmental biology. Additionally, our planet is dependent on the ecosystem services these charismatic insects provide, such as: nutrient cycling, enhancement of plant growth, seed dispersal, parasite suppression, fly control, trophic regulation and pollination ([Nichols et al., 2008](https://doi.org/10.1016/j.biocon.2008.04.011)).
        
        Yet, at least 30% of dung beetle species are undescribed and for many species we do not know how they evolved or how they are related to each other.Our lab is blending phenomics, genomics, biosystematics, and novel phylogenetic methods to reconstruct the evolutionary history among dung beetles.Discovering the origins of dung beetles and how they are related will help us to better understand how they maintain the health of Earth's ecosystems, how animal bodies are patterned and develop, and how Earth's stunning diversity of life forms have evolved.
        
