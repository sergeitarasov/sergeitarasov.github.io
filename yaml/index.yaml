sections:
  - heading: The evolution of form
    description: How does evolution generate the extraordinary diversity of life? We develop new ways to describe species, represent biological traits, and reconstruct evolutionary history—bringing these approaches together to investigate the patterns and processes of macroevolution. Dung beetles are a central study system, but our questions, and the methods we build to answer them, reach across the tree of life.
